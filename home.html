<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudchate - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Glass Effect Container */
    .glass-box {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    /* Inner 3D Glass Inputs & Buttons */
    .glass-input-3d {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .glass-btn-3d {
      background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
      transition: all 0.2s ease;
    }

    .glass-btn-3d:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 25px rgba(59, 130, 246, 0.6);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white h-screen flex p-2 md:p-4 overflow-hidden font-sans relative">

  <!-- Background Glows -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-blue-600 rounded-full mix-blend-screen filter blur-[130px] opacity-20 pointer-events-none"></div>

  <!-- Main App Shell -->
  <div class="glass-box w-full h-full rounded-3xl flex overflow-hidden z-10 border border-white/10">

    <!-- SIDEBAR (User Profile & Chats List) -->
    <div class="w-full md:w-80 lg:w-96 border-r border-white/10 flex flex-col bg-black/20">
      
      <!-- User Profile Header -->
      <div class="p-4 border-b border-white/10 flex items-center justify-between bg-white/5">
        <div class="flex items-center space-x-3">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg border border-white/30">
            <span id="user-avatar">U</span>
          </div>
          <div>
            <h2 id="user-name" class="font-bold text-sm text-white tracking-wide">Loading...</h2>
            <span class="text-xs text-green-400 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Online
            </span>
          </div>
        </div>

        <!-- Logout Button -->
        <button id="logout-btn" title="Logout" class="p-2 rounded-xl bg-white/5 hover:bg-red-500/20 hover:text-red-400 border border-white/10 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>

      <!-- Search Bar -->
      <div class="p-3">
        <input 
          type="text" 
          placeholder="Search chats..." 
          class="glass-input-3d w-full px-4 py-2.5 rounded-xl text-xs text-white placeholder-gray-400 outline-none"
        >
      </div>

      <!-- Chat List -->
      <div class="flex-1 overflow-y-auto px-2 space-y-1">
        <!-- Sample Active Chat Item -->
        <div class="flex items-center space-x-3 p-3 rounded-2xl bg-white/10 border border-white/10 cursor-pointer transition-all">
          <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center font-bold text-sm">
            C
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline">
              <h3 class="text-sm font-semibold truncate">Cloudchate Bot</h3>
              <span class="text-[10px] text-gray-400">12:00 PM</span>
            </div>
            <p class="text-xs text-gray-400 truncate">Welcome to Cloudchate!</p>
          </div>
        </div>
      </div>

    </div>

    <!-- MAIN CHAT AREA -->
    <div class="hidden md:flex flex-1 flex-col bg-black/10">
      
      <!-- Active Chat Header -->
      <div class="p-4 border-b border-white/10 flex items-center space-x-3 bg-white/5">
        <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center font-bold text-sm">
          C
        </div>
        <div>
          <h3 class="font-bold text-sm">Cloudchate Bot</h3>
          <p class="text-xs text-gray-400">Official Assistant</p>
        </div>
      </div>

      <!-- Messages Scroll Area -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Left Message -->
        <div class="flex flex-col items-start max-w-[75%]">
          <div class="glass-input-3d px-4 py-3 rounded-2xl rounded-tl-none text-sm">
            Hello! Cloudchate me aapka swagat hai. Main aapki kya madad kar sakta hoon?
          </div>
          <span class="text-[10px] text-gray-400 mt-1 ml-1">12:00 PM</span>
        </div>
      </div>

      <!-- Message Input Box -->
      <div class="p-4 border-t border-white/10 bg-white/5">
        <form id="chat-form" class="flex items-center space-x-2">
          <input 
            type="text" 
            id="chat-input"
            placeholder="Type a message..." 
            class="glass-input-3d flex-1 px-4 py-3 rounded-2xl text-sm text-white placeholder-gray-400 outline-none"
            required
          >
          <button type="submit" class="glass-btn-3d px-5 py-3 rounded-2xl text-sm font-bold flex items-center justify-center">
            <svg class="w-5 h-5 transform rotate-90" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
          </button>
        </form>
      </div>

    </div>

  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7iWZ0SfKWjii-zJXYZ7HPn9T38W3UIvA",
      authDomain: "cloudchate.firebaseapp.com",
      projectId: "cloudchate",
      storageBucket: "cloudchate.firebasestorage.app",
      messagingSenderId: "154786243659",
      appId: "1:154786243659:web:7fd6e43ec34c6f54b399ce",
      measurementId: "G-62G9V71PPJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Auth State Check (Login Check)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User logged in hai
        const name = user.displayName || user.email.split('@')[0];
        document.getElementById('user-name').innerText = name;
        document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
      } else {
        // Login nahi hai to login page par bhej dein
        window.location.href = "index.html";
      }
    });

    // Logout Function
    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });

    // Simple UI Chat Message Send Demo
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const messagesContainer = document.getElementById('messages-container');

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = chatInput.value.trim();
      if(!msg) return;

      const msgHTML = `
        <div class="flex flex-col items-end max-w-[75%] ml-auto">
          <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-4 py-3 rounded-2xl rounded-tr-none text-sm border border-white/20 shadow-lg">
            ${msg}
          </div>
          <span class="text-[10px] text-gray-400 mt-1 mr-1">Just now</span>
        </div>
      `;
      messagesContainer.insertAdjacentHTML('beforeend', msgHTML);
      chatInput.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
  </script>

</body>
</html>
