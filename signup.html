<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudchate - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Main Outer 3D Glass Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.25),
        inset 0 -1px 1px rgba(0, 0, 0, 0.5);
    }

    /* 3D Glass Text Effect inside Square Box */
    .glass-text-3d {
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.4),
        0 2px 4px rgba(0, 0, 0, 0.8),
        0 4px 12px rgba(59, 130, 246, 0.3);
      letter-spacing: 0.5px;
    }
    
    /* Inner 3D Glass Input Boxes */
    .glass-input-3d {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 
        inset 0 3px 6px rgba(0, 0, 0, 0.6),
        inset 0 -1px 2px rgba(255, 255, 255, 0.15),
        0 8px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .glass-input-3d:focus {
      border-top-color: rgba(59, 130, 246, 0.8);
      border-left-color: rgba(59, 130, 246, 0.6);
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.5),
        0 0 18px rgba(59, 130, 246, 0.5),
        0 10px 20px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 100%);
    }

    /* 3D Glowing Button */
    .glass-btn-3d {
      background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 10px 25px rgba(59, 130, 246, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -2px 5px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .glass-btn-3d:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 15px 30px rgba(59, 130, 246, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .glass-btn-3d:active {
      transform: translateY(1px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex items-center justify-center p-4 relative font-sans py-12">

  <!-- Background Glows -->
  <div class="absolute top-1/4 left-1/4 w-80 h-80 bg-purple-600 rounded-full mix-blend-screen filter blur-[100px] opacity-25 animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-25 animate-pulse"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-indigo-500 rounded-full mix-blend-screen filter blur-[90px] opacity-20"></div>

  <!-- Main Container -->
  <div class="w-full max-w-md flex flex-col items-center z-10">

    <!-- LOGO & APP NAME -->
    <div class="flex flex-col items-center mb-8 text-center">
      <div class="w-20 h-20 mb-4 bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-blue-500/40 border-t border-l border-white/40 border-b border-r border-black/30 transform hover:scale-105 transition-transform duration-300">
        <svg class="w-11 h-11 text-white drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
      </div>

      <h1 class="text-4xl font-black tracking-widest bg-gradient-to-r from-blue-400 via-indigo-200 to-purple-400 bg-clip-text text-transparent drop-shadow-lg">
        Cloudchate
      </h1>
    </div>

    <!-- MAIN 3D GLASS SQUARE BOX -->
    <div class="glass-card w-full p-8 rounded-3xl mb-6">
      <form id="signup-form" class="space-y-4">
        
        <!-- Username Field -->
        <div>
          <label class="block text-xs font-bold mb-2 ml-1 uppercase tracking-wide glass-text-3d">
            Username
          </label>
          <input 
            type="text" 
            id="username"
            placeholder="Username chunein" 
            class="glass-input-3d w-full px-4 py-3.5 rounded-2xl text-sm text-white placeholder-gray-400 outline-none"
            required
          >
        </div>

        <!-- Phone Number Field -->
        <div>
          <label class="block text-xs font-bold mb-2 ml-1 uppercase tracking-wide glass-text-3d">
            Phone Number
          </label>
          <input 
            type="tel" 
            id="phone"
            placeholder="Apna Phone Number daalein" 
            class="glass-input-3d w-full px-4 py-3.5 rounded-2xl text-sm text-white placeholder-gray-400 outline-none"
            required
          >
        </div>

        <!-- Gmail Field -->
        <div>
          <label class="block text-xs font-bold mb-2 ml-1 uppercase tracking-wide glass-text-3d">
            Gmail / Email
          </label>
          <input 
            type="email" 
            id="email"
            placeholder="Apna Gmail Address daalein" 
            class="glass-input-3d w-full px-4 py-3.5 rounded-2xl text-sm text-white placeholder-gray-400 outline-none"
            required
          >
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-bold mb-2 ml-1 uppercase tracking-wide glass-text-3d">
            Password
          </label>
          <input 
            type="password" 
            id="password"
            placeholder="••••••••" 
            class="glass-input-3d w-full px-4 py-3.5 rounded-2xl text-sm text-white placeholder-gray-400 outline-none"
            required
            minlength="6"
          >
        </div>

        <!-- Confirm Password Field -->
        <div>
          <label class="block text-xs font-bold mb-2 ml-1 uppercase tracking-wide glass-text-3d">
            Confirm Password
          </label>
          <input 
            type="password" 
            id="confirm-password"
            placeholder="••••••••" 
            class="glass-input-3d w-full px-4 py-3.5 rounded-2xl text-sm text-white placeholder-gray-400 outline-none"
            required
            minlength="6"
          >
        </div>

        <button type="submit" id="signup-btn" class="glass-btn-3d w-full py-4 rounded-2xl font-bold text-base text-white tracking-wider mt-2 glass-text-3d uppercase">
          CREATE ACCOUNT
        </button>
      </form>
    </div>

    <!-- BOTTOM OPTIONS -->
    <div class="w-full flex items-center justify-between text-sm px-3">
      <a href="about.html" class="text-gray-400 hover:text-white font-medium transition-colors duration-200 underline underline-offset-4">
        About Cloudchate
      </a>
      <a href="index.html" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors duration-200">
        Already have an account? Log In
      </a>
    </div>

  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Aapki Firebase Configuration Keys
    const firebaseConfig = {
      apiKey: "AIzaSyC7iWZ0SfKWjii-zJXYZ7HPn9T38W3UIvA",
      authDomain: "cloudchate.firebaseapp.com",
      projectId: "cloudchate",
      storageBucket: "cloudchate.firebasestorage.app",
      messagingSenderId: "154786243659",
      appId: "1:154786243659:web:7fd6e43ec34c6f54b399ce",
      measurementId: "G-62G9V71PPJ"
    };

    // Firebase Initialize
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Form Handle
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim().toLowerCase();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('signup-btn');

      // Check passwords match
      if (password !== confirmPassword) {
        alert("Passwords match nahi ho rahe hain!");
        return;
      }

      btn.innerText = "CREATING ACCOUNT...";
      btn.disabled = true;

      try {
        // 1. Firebase Auth me Email + Password se account banayein
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. Auth Profile me Username set karein
        await updateProfile(user, {
          displayName: username
        });

        // 3. Database (Firestore) me Username, Phone aur Email save karein
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          username: username,
          phone: phone,
          email: email,
          createdAt: new Date().toISOString()
        });

        alert("Account Successfully Ban Gaya!");
        window.location.href = "index.html";
      } catch (error) {
        alert("Error: " + error.message);
        btn.innerText = "CREATE ACCOUNT";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
