<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudchate - Create Post</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 3D Glass Styling */
    .glass-box {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .glass-input-3d {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .glass-nav-3d {
      background: rgba(11, 15, 25, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col font-sans relative overflow-x-hidden pb-24 md:pb-0">

  <!-- Background Ambient Glows -->
  <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[130px] opacity-20 pointer-events-none"></div>
  <div class="fixed bottom-1/4 right-1/4 w-[30rem] h-[30rem] bg-blue-600 rounded-full mix-blend-screen filter blur-[140px] opacity-20 pointer-events-none"></div>

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 glass-box border-b border-white/10 px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <a href="home.html" class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-blue-500 via-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg border border-white/30">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <h1 class="text-2xl font-black tracking-widest bg-gradient-to-r from-blue-400 via-indigo-200 to-purple-400 bg-clip-text text-transparent">
          Create Post
        </h1>
      </a>
    </div>
  </header>

  <!-- MAIN POST CREATION FORM -->
  <main class="max-w-2xl mx-auto w-full flex-1 p-4 md:py-8">
    <div class="glass-card rounded-3xl p-6 border border-white/10 space-y-6">
      
      <!-- User Header Info -->
      <div class="flex items-center space-x-3">
        <div id="user-avatar" class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-base shadow-md">
          U
        </div>
        <div>
          <h3 id="user-name" class="font-bold text-sm text-white">Loading...</h3>
          <p class="text-[11px] text-gray-400">Public Post</p>
        </div>
      </div>

      <form id="add-post-form" class="space-y-5">
        
        <!-- Image Upload Box -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-gray-300">Select Image</label>
          <div 
            onclick="document.getElementById('file-input').click()"
            class="glass-input-3d border-2 border-dashed border-white/20 hover:border-blue-400/50 rounded-2xl p-6 text-center cursor-pointer transition-all flex flex-col items-center justify-center relative overflow-hidden min-h-[200px]"
          >
            <input type="file" id="file-input" accept="image/*" class="hidden">
            
            <div id="upload-placeholder" class="flex flex-col items-center">
              <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center mb-2">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              </div>
              <p class="text-xs text-gray-300 font-medium">Click to upload photo</p>
              <p class="text-[10px] text-gray-500 mt-1">PNG, JPG, JPEG up to 5MB</p>
            </div>

            <!-- Image Preview -->
            <img id="image-preview" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl">
          </div>
        </div>

        <!-- Caption Input -->
        <div class="space-y-2">
          <label for="caption" class="block text-xs font-semibold text-gray-300">Caption</label>
          <textarea 
            id="caption"
            rows="4" 
            placeholder="Write a caption... #cloudchate"
            class="glass-input-3d w-full p-4 rounded-xl text-xs text-white placeholder-gray-400 outline-none focus:ring-1 focus:ring-blue-400/50 resize-none"
            required
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submit-btn"
          class="w-full py-3.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 hover:opacity-90 rounded-xl font-bold text-xs tracking-wider uppercase shadow-lg active:scale-[0.98] transition-all flex items-center justify-center space-x-2"
        >
          <span>Share Post</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>

      </form>

    </div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 glass-nav-3d px-6 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <button onclick="window.location.href='home.html'" title="Home" class="flex flex-col items-center text-gray-400 hover:text-blue-400 transition-colors active:scale-95">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px] font-medium mt-0.5">Home</span>
      </button>

      <button onclick="window.location.href='chat.html'" title="Messages" class="flex flex-col items-center text-gray-400 hover:text-blue-400 transition-colors active:scale-95">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        <span class="text-[10px] font-medium mt-0.5">Message</span>
      </button>

      <button onclick="window.location.href='add.html'" title="Add Post" class="flex flex-col items-center text-blue-400 transition-transform active:scale-95">
        <div class="w-9 h-9 -mt-3 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-full flex items-center justify-center shadow-lg border border-white/40">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <span class="text-[10px] font-medium mt-0.5">Add</span>
      </button>

      <button onclick="window.location.href='profile.html'" title="Profile" class="flex flex-col items-center text-gray-400 hover:text-white transition-colors active:scale-95">
        <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 border border-white/60 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">
          <span id="nav-user-avatar">U</span>
        </div>
        <span class="text-[10px] font-medium mt-0.5">Profile</span>
      </button>
    </div>
  </nav>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7iWZ0SfKWjii-zJXYZ7HPn9T38W3UIvA",
      authDomain: "cloudchate.firebaseapp.com",
      projectId: "cloudchate",
      storageBucket: "cloudchate.firebasestorage.app",
      messagingSenderId: "154786243659",
      appId: "1:154786243659:web:7fd6e43ec34c6f54b399ce",
      measurementId: "G-62G9V71PPJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let base64Image = "";

    // Auth state check
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const name = user.displayName || user.email.split('@')[0];
        const initial = name.charAt(0).toUpperCase();

        document.getElementById('user-name').innerText = name;
        document.getElementById('user-avatar').innerText = initial;
        document.getElementById('nav-user-avatar').innerText = initial;
      } else {
        window.location.href = "index.html";
      }
    });

    // Image Preview & Base64 Converter
    const fileInput = document.getElementById('file-input');
    const imagePreview = document.getElementById('image-preview');
    const uploadPlaceholder = document.getElementById('upload-placeholder');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          base64Image = event.target.result;
          imagePreview.src = base64Image;
          imagePreview.classList.remove('hidden');
          uploadPlaceholder.classList.add('opacity-0');
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle Post Submission
    const addPostForm = document.getElementById('add-post-form');
    const submitBtn = document.getElementById('submit-btn');

    addPostForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const caption = document.getElementById('caption').value.trim();
      if (!caption) return;

      submitBtn.disabled = true;
      submitBtn.innerText = "Publishing Post...";

      try {
        await addDoc(collection(db, "posts"), {
          userId: currentUser.uid,
          username: currentUser.displayName || currentUser.email.split('@')[0],
          caption: caption,
          imageUrl: base64Image || null,
          likesCount: 0,
          likedBy: [],
          createdAt: serverTimestamp()
        });

        // Redirect to Home feed on success
        window.location.href = "home.html";
      } catch (error) {
        console.error("Error creating post:", error);
        alert("Post publish karne me issue aaya. Dobara try karein.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Share Post";
      }
    });
  </script>
</body>
</html>
