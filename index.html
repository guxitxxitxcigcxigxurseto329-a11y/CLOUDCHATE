<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLOUDCHATE - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* Perfect match for Vibrant Colorful Splash Background */
      background: 
        radial-gradient(circle at 50% 50%, rgba(3, 169, 244, 0.45) 0%, transparent 60%),
        radial-gradient(circle at 15% 25%, rgba(0, 150, 214, 0.9) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(236, 64, 122, 0.8) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255, 214, 0, 0.85) 0%, transparent 45%),
        radial-gradient(circle at 20% 80%, rgba(76, 175, 80, 0.8) 0%, transparent 45%),
        #0fb2f0;
      background-blend-mode: color-dodge, normal, normal, normal, normal, normal;
      background-size: cover;
      overflow: hidden;
    }

    /* Outer Container Frame */
    .glass-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 12px;
      
      /* Exact Glass Bevel Effect */
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.2),
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(0, 0, 0, 0.2);
    }

    /* Brand Header Section */
    .brand-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .cloud-logo {
      width: 75px;
      height: 50px;
      margin: 0 auto 8px;
    }

    .cloud-logo svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 3px 5px rgba(0, 80, 150, 0.35));
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0277bd;
      letter-spacing: 1.2px;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
    }

    /* Labels & Controls */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: #000000;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    /* 3D Glass Inputs */
    .glass-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      outline: none;
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.25),
        inset 0 -1px 1px rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }

    .glass-input::placeholder {
      color: #ffffff;
      font-weight: 800;
      opacity: 0.95;
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.38);
      border-color: #ffffff;
      box-shadow: 
        inset 0 3px 5px rgba(0, 0, 0, 0.3),
        0 0 6px rgba(255, 255, 255, 0.8);
    }

    /* 3D Glass Sign-In Button */
    .btn-3d-glass {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(180deg, #29b6f6 0%, #0277bd 100%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 
        0 4px 12px rgba(0, 50, 100, 0.35),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.7),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.35);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: all 0.15s ease;
    }

    .btn-3d-glass:hover {
      background: linear-gradient(180deg, #4fc3f7 0%, #0288d1 100%);
      transform: translateY(-1px);
    }

    .btn-3d-glass:active {
      transform: translateY(1px);
      box-shadow: 
        0 2px 6px rgba(0, 50, 100, 0.3),
        inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* Footer Links */
    .form-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.88rem;
      color: #000000;
      font-weight: 600;
    }

    .form-footer a {
      color: #0277bd;
      font-weight: 700;
      text-decoration: none;
      margin-left: 3px;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <!-- Header -->
    <div class="brand-section">
      <div class="cloud-logo">
        <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#81d4fa" />
              <stop offset="50%" stop-color="#0288d1" />
              <stop offset="100%" stop-color="#01579b" />
            </linearGradient>
            <linearGradient id="cloudBorder" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#0288d1" stop-opacity="0.3" />
            </linearGradient>
          </defs>
          <path d="M18 40 C10 40 4 34 4 26 C4 19 9 14 16 13 C18 7 24 2 32 2 C41 2 48 8 50 15 C56 16 60 21 60 27 C60 34 54 40 46 40 Z" 
                fill="url(#cloudGrad)" stroke="url(#cloudBorder)" stroke-width="2.2"/>
          <path d="M35 17 C28 17 23 22 23 28 C23 34 28 39 35 39 C39 39 42 37 44 34" 
                stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <h1 class="brand-title">CLOUDCHATE</h1>
    </div>

    <!-- Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="identity">Email, Username, phone</label>
        <input type="text" id="identity" class="glass-input" placeholder="**name@example.com**" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="glass-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-3d-glass">Sign In</button>
    </form>

    <!-- Links -->
    <div class="form-footer">
      <span>I have alray account?</span>
      <a href="#">Create new account</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const value = document.getElementById('identity').value;
      alert('Sign in attempt: ' + value);
    });
  </script>

</body>
</html>
