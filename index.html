<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLOUDCHATE - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom 3D Glassmorphism Effect */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    .glass-input {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4),
                  0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .glass-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

  <!-- 80% Dark Colorful Background Glows -->
  <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-purple-600 rounded-full mix-blend-screen filter blur-3xl opacity-20 animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-blue-600 rounded-full mix-blend-screen filter blur-3xl opacity-20 animate-pulse"></div>
  <div class="absolute top-1/3 right-1/3 w-64 h-64 bg-indigo-500 rounded-full mix-blend-screen filter blur-3xl opacity-15"></div>

  <!-- Main Container -->
  <div class="w-full max-w-md flex flex-col items-center z-10">

    <!-- Single Main 3D Glass Box (Contains Logo, Name & Form) -->
    <div class="glass-card w-full p-8 rounded-3xl mb-6">
      
      <!-- Top: Logo & App Name (Inside Box) -->
      <div class="flex flex-col items-center mb-8 text-center">
        <!-- New Design Logo -->
        <div class="w-16 h-16 mb-3 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 border border-white/20">
          <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
          </svg>
        </div>

        <!-- App Name -->
        <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
          CLOUDCHATE
        </h1>
      <!-- Form Inputs -->
      <form class="space-y-5" onsubmit="event.preventDefault();">
        
        <!-- Combined Input (Gmail / Username / Phone) -->
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1.5 ml-1">
            Gmail, Username, ya Phone
          </label>
          <input 
            type="text" 
            placeholder="Gmail, Username ya Phone Number daalein" 
            class="glass-input w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-gray-500 outline-none transition-all duration-200"
          >
        </div>

        <!-- Password Input -->
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1.5 ml-1">
            Password
          </label>
          <input 
            type="password" 
            placeholder="••••••••" 
            class="glass-input w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-gray-500 outline-none transition-all duration-200"
          >
        </div>

        <!-- Login Button -->
        <button type="submit" class="w-full mt-3 py-3.5 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 font-semibold rounded-xl text-white shadow-lg shadow-indigo-500/25 active:scale-[0.98] transition-all duration-200">
          Login
        </button>
      </form>
    </div>

    <!-- Bottom Section: Options (Outside Box) -->
    <div class="w-full flex items-center justify-between text-sm px-2">
      <button class="text-gray-400 hover:text-white transition-colors duration-200 underline underline-offset-4">
        About CLOUDCHATE
      </button>
      <button class="text-blue-400 hover:text-blue-300 font-medium transition-colors duration-200">
        Create New Account
      </button>
    </div>

  </div>

</body>
</html>
