<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLOUDCHATE - Glass Login</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    /* 1. Sharp Colorful Background (No Blur) */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d1b2a;
      position: relative;
      overflow: hidden;
    }

    /* Sharp Colorful Splashes on Background */
    .bg-splash-1 {
      position: absolute;
      top: -10%;
      left: -5%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #ff007f 0%, #7928ca 70%, transparent 100%);
      border-radius: 50%;
    }

    .bg-splash-2 {
      position: absolute;
      bottom: -10%;
      right: -5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #00f2fe 0%, #4facfe 70%, transparent 100%);
      border-radius: 50%;
    }

    .bg-splash-3 {
      position: absolute;
      top: 20%;
      right: 15%;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, #ff0055 0%, #ffcc00 80%, transparent 100%);
      transform: rotate(45deg);
    }

    .bg-splash-4 {
      position: absolute;
      bottom: 15%;
      left: 10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #00ff87 0%, #60efff 80%, transparent 100%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    /* 2. Square Blurred Glass Container */
    .login-square {
      position: relative;
      z-index: 10;
      width: 380px;
      padding: 35px 30px;
      background: rgba(255, 255, 255, 0.15);
      /* Heavy Glass Blur */
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 12px; /* Square shape with subtle corners */
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  inset 0 0 20px rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    /* Logo Styling */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    .cloud-icon {
      width: 70px;
      height: 45px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border-radius: 50px;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,114,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cloud-icon::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 12px;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border-radius: 50%;
    }

    .cloud-icon::after {
      content: '';
      position: absolute;
      top: -8px;
      right: 12px;
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border-radius: 50%;
    }

    .cloud-icon span {
      position: relative;
      z-index: 2;
      color: #fff;
      font-weight: 900;
      font-size: 20px;
    }

    .app-title {
      margin-top: 12px;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* Form & Input Styling */
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* 3. Diamond Design Input Boxes */
    .diamond-input-wrapper {
      position: relative;
      width: 100%;
    }

    .diamond-input {
      width: 100%;
      padding: 14px 20px;
      font-size: 14px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      outline: none;
      /* Diamond Bevel Edge Cut */
      clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0% 50%);
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .diamond-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .diamond-input:focus {
      background: rgba(255, 255, 255, 0.25);
      border-color: #00f2fe;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
    }

    /* 4. 3D Colorful Login Button */
    .btn-3d-wrapper {
      position: relative;
      margin-top: 15px;
    }

    .btn-3d {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      /* Vibrant Multi-color Gradient */
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #00f2fe 100%);
      /* 3D Depth Shadow Effect */
      box-shadow: 0 8px 0 #4a0080, 
                  0 15px 20px rgba(0, 0, 0, 0.4),
                  inset 0 2px 3px rgba(255, 255, 255, 0.6);
      transition: all 0.15s ease-in-out;
    }

    /* Hover & Active 3D Press Effect */
    .btn-3d:hover {
      filter: brightness(1.1);
      box-shadow: 0 8px 0 #4a0080, 0 18px 25px rgba(255, 0, 127, 0.4);
    }

    .btn-3d:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #4a0080, 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    /* Footer Links */
    .footer-text {
      margin-top: 22px;
      font-size: 13px;
      color: #ffffff;
    }

    .footer-text a {
      color: #00f2fe;
      text-decoration: none;
      font-weight: 700;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Sharp Non-Blurred BG Splashes -->
  <div class="bg-splash-1"></div>
  <div class="bg-splash-2"></div>
  <div class="bg-splash-3"></div>
  <div class="bg-splash-4"></div>

  <!-- Square Blurred Glass Container -->
  <div class="login-square">
    
    <!-- Logo -->
    <div class="logo-container">
      <div class="cloud-icon">
        <span>C</span>
      </div>
      <h1 class="app-title">CLOUDCHATE</h1>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Email, Username, Phone</label>
        <div class="diamond-input-wrapper">
          <input 
            type="text" 
            id="username" 
            class="diamond-input" 
            placeholder="name@example.com" 
            required
          >
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="diamond-input-wrapper">
          <input 
            type="password" 
            id="password" 
            class="diamond-input" 
            placeholder="••••••••" 
            required
          >
        </div>
      </div>

      <div class="btn-3d-wrapper">
        <button type="submit" class="btn-3d">Sign In</button>
      </div>
    </form>

    <div class="footer-text">
      I have an account? <a href="#">Create new account</a>
    </div>

  </div>

  <!-- JavaScript Functionality -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if(username && password) {
        alert('Logging in to CLOUDCHATE as: ' + username);
      } else {
        alert('Please fill out all fields.');
      }
    });
  </script>

</body>
</html>
